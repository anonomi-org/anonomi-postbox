plugins {
	id 'com.android.application'
	id 'androidx.navigation.safeargs'
	id 'kotlin-android'
	id 'kotlin-kapt'
	id 'dagger.hilt.android.plugin'
	id "org.jlleitschuh.gradle.ktlint" version "$ktlint_plugin_version"
	id 'checkstyle'
}

import com.android.build.gradle.tasks.MergeResources
import java.util.Properties
import java.io.FileInputStream

def releaseApkName = "anonomi-postbox-release.apk"

def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
	keystoreProps.load(new FileInputStream(keystoreFile))
}

def envOrNull = { String name ->
	def v = System.getenv(name)
	return (v != null && !v.trim().isEmpty()) ? v.trim() : null
}

def hasCiSigning = {
	envOrNull("ANDROID_KEYSTORE_PATH") != null &&
		envOrNull("ANDROID_KEYSTORE_PASSWORD") != null &&
		envOrNull("ANDROID_KEY_ALIAS") != null &&
		envOrNull("ANDROID_KEY_PASSWORD") != null
}
checkstyle {
    configFile = new File('../config/checkstyle/checkstyle.xml')
}

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.1"

    namespace "org.anonomi.postbox"

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

	signingConfigs {
		release {
			if (keystoreFile.exists()) {
				// Local dev: values come from keystore.properties in repo root
				// storeFile is relative to repo root, but mailbox module is nested, so keep your "../"
				storeFile file(keystoreProps['storeFile'])
				storePassword keystoreProps['storePassword']
				keyAlias keystoreProps['keyAlias']
				keyPassword keystoreProps['keyPassword']
			} else if (hasCiSigning()) {
				// CI: GitHub Actions writes keystore to a path and sets env vars
				storeFile file(envOrNull("ANDROID_KEYSTORE_PATH"))
				storePassword envOrNull("ANDROID_KEYSTORE_PASSWORD")
				keyAlias envOrNull("ANDROID_KEY_ALIAS")
				keyPassword envOrNull("ANDROID_KEY_PASSWORD")
			}
		}
	}


	defaultConfig {
        applicationId "org.anonomi.postbox"
        minSdkVersion 16
        targetSdkVersion 33
        versionCode 10005
        versionName "1.0.5"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments disableAnalytics: 'true'
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            shrinkResources false
            minifyEnabled true
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
	    release {
		    if (keystoreFile.exists() || hasCiSigning()) {
			    signingConfig signingConfigs.release
		    }
		    shrinkResources false
		    minifyEnabled true
		    crunchPngs false
		    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
	    }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        exclude 'META-INF/*'
        exclude 'META-INF/licenses/*'
        exclude '**/attach_hotspot_windows.dll'
    }

    lintOptions {
        warning 'MissingTranslation'
        warning 'ExtraTranslation'
    }

    // F-Droid's Binaries: field resolves to one exact URL, so the release asset
    // needs a stable name. This also drops AGP's "-unsigned" suffix, so signed
    // output is told apart with apksigner rather than by filename.
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                output.outputFileName = releaseApkName
            }
        }
    }
}

configurations {
    tor
}

dependencies {
    implementation project(path: ':mailbox-core', configuration: 'default')
    implementation 'org.briarproject:dont-kill-me-lib:0.2.5'

    implementation 'com.github.tony19:logback-android:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation "androidx.activity:activity-ktx:1.6.1"
    implementation "androidx.fragment:fragment-ktx:1.5.5"
    implementation 'androidx.preference:preference-ktx:1.2.0'

    def lifecycle_version = "2.5.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"

    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.material:material:1.8.0"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'

    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"

    tor "org.briarproject:tor-android:$tor_version"
    tor "org.briarproject:lyrebird-android:$lyrebird_version"

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

def torBinariesDir = 'src/main/res/raw'
def torLibsDir = 'src/main/jniLibs'

task cleanTorBinaries {
    doLast {
        delete fileTree(torBinariesDir) { include '*.zip' }
        delete fileTree(torLibsDir) { include '**/*.so' }
    }
}

clean.dependsOn cleanTorBinaries

task unpackTorBinaries {
    doLast {
        configurations.tor.each { jar ->
            // Both tor-android and lyrebird-android ship .so files directly in
            // architecture directories
            copy {
                from(zipTree(jar)) {
                    include 'armeabi-v7a/*.so'
                    include 'arm64-v8a/*.so'
                    include 'x86/*.so'
                    include 'x86_64/*.so'
                }
                into torLibsDir
            }
        }
    }
    dependsOn cleanTorBinaries
}

tasks.withType(MergeResources) {
    inputs.dir torBinariesDir
    inputs.dir torLibsDir
    dependsOn unpackTorBinaries
}

// A release build without a keystore still succeeds, and the pinned output name
// means it is spelled exactly like a signed one, so a filename cannot tell them
// apart. An unsigned companion APK cannot be installed from the hotspot, so ask
// apksigner instead of trusting the name.
tasks.register("verifyReleaseApkSigned") {
    dependsOn("assembleRelease")
    doLast {
        def apk = file("$buildDir/outputs/apk/release/$releaseApkName")
        if (!apk.isFile()) {
            throw new GradleException("no release APK at $apk")
        }
        def apksigner = new File(android.sdkDirectory,
            "build-tools/${android.buildToolsVersion}/apksigner")
        if (!apksigner.canExecute()) {
            throw new GradleException("apksigner not executable at $apksigner")
        }
        def output = new ByteArrayOutputStream()
        def verify = exec {
            commandLine apksigner, "verify", "--print-certs", apk
            standardOutput = output
            errorOutput = output
            ignoreExitValue = true
        }
        if (verify.exitValue != 0) {
            throw new GradleException("$releaseApkName is unsigned or its signature is " +
                "invalid, refusing to bundle it. Build with keystore.properties in the " +
                "repo root, or with the ANDROID_KEYSTORE_* environment variables set.\n" +
                output)
        }
        output.toString().readLines()
            .findAll { it =~ /(?i)certificate SHA-256 digest/ }
            .each { logger.lifecycle("$releaseApkName ${it.trim()}") }
    }
}

// Goes to src/official/assets, not src/main: only the official flavour bundles
// companion APKs, so src/main would reach the fdroid build too.
tasks.register("copyApkToAnonomiAssets", Copy) {
    dependsOn("verifyReleaseApkSigned")
    from("$buildDir/outputs/apk/release") {
        include(releaseApkName)
        rename { "anonomi-postbox.apk" }
    }
    into("$rootDir/../anonomi-android/src/official/assets/")
}

apply from: "../gradle/ktlint.gradle"
apply from: "../gradle/checkstyle.gradle"