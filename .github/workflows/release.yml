name: Release (Postbox APK)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/anonomi.keystore"

      - name: Build signed Postbox APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/anonomi.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :postbox-android:assembleRelease

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist

          echo "Postbox APKs:"
          ls -lah postbox-android/build/outputs/apk/release/
          cp postbox-android/build/outputs/apk/release/*.apk dist/

          echo "Collected:"
          ls -lah dist

      # build.gradle pins outputFileName, so an unsigned build gets the same name
      # as a signed one. Filenames are not a signature check -- ask apksigner.
      - name: Verify release APK is signed with the expected key
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::neither ANDROID_HOME nor ANDROID_SDK_ROOT is set"
            exit 1
          fi
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Using $APKSIGNER"

          # Shared across all Anonomi APKs (messenger official/fdroid + postbox).
          # Pinned in three places that must rotate together:
          #   - EXPECTED_SHA256 here
          #   - EXPECTED_SHA256 in anonomi-android/.github/workflows/release.yml
          #   - AllowedAPKSigningKeys in metadata/org.anonomi.postbox.yml on fdroiddata
          EXPECTED_SHA256="0c42c2a2e9be889eef2e7da10e8cd9cc71e6e6bc0e676fc994a8066d1766cb8d"

          REQUIRED="anonomi-postbox-release.apk"
          if [ ! -f "dist/$REQUIRED" ]; then
            echo "::error::missing dist/$REQUIRED"
            exit 1
          fi

          fail=0
          for apk in dist/*.apk; do
            name="$(basename "$apk")"
            if ! "$APKSIGNER" verify --print-certs "$apk" > /tmp/sig.txt 2>&1; then
              echo "::error::UNSIGNED or INVALID signature: $name"
              cat /tmp/sig.txt
              fail=1
              continue
            fi
            sha="$(grep -m1 -i 'certificate SHA-256 digest' /tmp/sig.txt | awk '{print $NF}')"
            echo "signed OK: $name (SHA-256 $sha)"
            if [ "$name" = "$REQUIRED" ] && [ "$sha" != "$EXPECTED_SHA256" ]; then
              echo "::error::$name signing key $sha != AllowedAPKSigningKeys $EXPECTED_SHA256"
              fail=1
            fi
          done
          exit $fail

      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk